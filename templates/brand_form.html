{% extends 'base.html' %}

{% block title %}
    {% if view.object %}{{ view.object.name }}{% else %}Add Brand{% endif %}
{% endblock %}

{% block content %}
<h2>
    {% if view.object %}{{ view.object.name }}{% else %}Add Brand{% endif %}
</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'parts:brand_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
