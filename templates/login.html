{% extends 'base.html' %}

{% block title %}Login | SpareParts{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header text-center bg-success text-white">
                <h4>Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>
                <p class="text-center mt-3">
                    Don't have an account? <a href="{% url 'core:signup' %}">Sign up here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
