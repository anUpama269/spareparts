{% extends "base.html" %}
{% load static %}
{% block title %}Delete Purchase Order{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirm Delete</h4>
        </div>

        <div class="card-body">
            <p>Are you sure you want to delete Purchase Order <strong>{{ object.po_number }}</strong>?</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fa fa-trash"></i> Delete
                </button>
                <a href="{% url 'procurement:purchaseorder_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
