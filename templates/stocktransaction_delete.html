{% extends 'base.html' %}
{% block title %}Delete Stock Transaction{% endblock %}

{% block content %}
<h2>Delete Stock Transaction</h2>
<p>Are you sure you want to delete the transaction for <strong>{{ view.object.item.name }}</strong> (Qty: {{ view.object.quantity }})?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'inventory:stocktransaction_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
