{% extends 'base.html' %}

{% block title %}
{{ view.object.id|default:"Add Stock Transaction" }}
{% endblock %}

{% block content %}
<h2>{{ view.object.id|default:"Add Stock Transaction" }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        {% if view.object %}Update{% else %}Save{% endif %}
    </button>
    <a href="{% url 'inventory:stocktransaction_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
