{% extends "base.html" %}
{% load static %}
{% block title %}Delete Supplier | Procurement{% endblock %}

{% block content %}
<div class="card shadow-sm mt-4">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Delete Supplier</h4>
    </div>

    <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'procurement:supplier_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
